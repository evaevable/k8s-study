name: 构建并部署在线版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.40"
  MDBOOK_MERMAID_VERSION: "0.14.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 mdBook 与 mermaid 预处理器
        run: |
          set -eux
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          mdbook --version
          mdbook-mermaid --version

      - name: 校验 BOOK.md 与 SUMMARY.md 是否与章节同步
        run: |
          set -eux
          cp BOOK.md /tmp/BOOK.md.orig
          cp chapters/SUMMARY.md /tmp/SUMMARY.md.orig
          bash tools/build-book.sh
          diff -q /tmp/BOOK.md.orig BOOK.md
          diff -q /tmp/SUMMARY.md.orig chapters/SUMMARY.md

      - name: 生成 mermaid 资源并构建
        run: |
          set -eux
          mdbook-mermaid install .
          mdbook build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
