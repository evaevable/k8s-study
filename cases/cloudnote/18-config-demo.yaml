# ============================================================================
# 第 8 章动手实验：三种注入方式并存的演示 Pod
#
# 这个 Pod 里**同时**用三种方式读取同一个 ConfigMap：
#   ① 环境变量（configMapKeyRef）      → $LOG_LEVEL
#   ② 目录卷挂载                        → /etc/app/log.level
#   ③ subPath 单文件挂载                → /etc/app-single/log.level
#
# 改一次 ConfigMap，等 90 秒，然后对比这三路的值：
#   ① 不变（环境变量在容器创建时就固定了）
#   ② 变了（kubelet 会持续同步，用原子替换软链接的方式）
#   ③ 不变（subPath 挂载永不更新，这是设计如此）
#
# 使用：
#   kubectl apply -f 00-namespace.yaml
#   kubectl apply -f 10-config.yaml
#   kubectl apply -f 18-config-demo.yaml
#   kubectl logs config-demo -n cloudnote --tail=6
# ============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: cloudnote
  labels:
    app: cloudnote
    purpose: chapter-08-demo
spec:
  containers:
    - name: demo
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "[demo] 启动完成，每 30 秒打印一次三路配置的当前值"
          while true; do
            echo "==== $(date +%H:%M:%S) ===="
            echo "① 环境变量      LOG_LEVEL = $LOG_LEVEL"
            echo "② 目录挂载      = $(cat /etc/app/log.level 2>/dev/null)"
            echo "③ subPath 挂载  = $(cat /etc/app-single/log.level 2>/dev/null)"
            sleep 30
          done

      # ① 环境变量注入：改动 ConfigMap 后**永远不会**反映到这里
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: log.level
        # Secret 也可以用同样方式注入
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: DB_PASSWORD

      volumeMounts:
        # ② 目录卷挂载：kubelet 持续同步，改 ConfigMap 后约 1 分钟自动更新
        #    注意 defaultMode 只影响文件权限，不是安全边界
        - name: cfg-dir
          mountPath: /etc/app
          readOnly: true

        # ③ subPath 单文件挂载：好处是只覆盖这一个文件（不污染目录）
        #    代价是**永不更新**（官方文档明确说明的设计行为）
        - name: cfg-dir
          mountPath: /etc/app-single/log.level
          subPath: log.level
          readOnly: true

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi

  volumes:
    - name: cfg-dir
      configMap:
        name: api-config
        # optional: true      # 打开它，ConfigMap 不存在时也不会阻塞 Pod 启动

  restartPolicy: Always
