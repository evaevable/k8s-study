# ============================================================================
# CloudNote 的 api 服务 —— Service（第 6 章）
#
# 作用：给 api 的 2 个 Pod 一个稳定的访问入口。
#   集群内访问：http://api:8080        （靠 CoreDNS 解析）
#   或         http://api.cloudnote.svc.cluster.local:8080
#
# 注意端口映射：
#   port: 8080        → 集群内别人访问 Service 时用的端口
#   targetPort: http  → 转发到容器里名为 http 的端口（即 containerPort: 80）
#
#   这里故意让两者不同，用来演示端口映射。
#   targetPort 用「端口名」而不是数字，是为了解耦：
#   将来把 containerPort 从 80 改成 8080，只要名字还叫 http，这个 Service 完全不用动。
#
# 使用：
#   kubectl apply -f 00-namespace.yaml
#   kubectl apply -f 20-api-deployment.yaml
#   kubectl apply -f 22-api-service.yaml
#   kubectl get endpoints api -n cloudnote
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cloudnote
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: cloudnote
spec:
  # ① 类型：默认就是 ClusterIP（只有集群内部能访问）
  #    可选值：ClusterIP | NodePort | LoadBalancer | ExternalName
  type: ClusterIP

  # ② 我服务谁 —— 靠标签选择器找到 Pod
  #    这一行写错，Endpoints 就会是空的，而 kubectl get svc 一切正常
  #    注意：Service 与 Deployment 之间没有任何直接引用，唯一联系就是这个标签
  selector:
    app: api

  # ③ 端口映射
  ports:
    - name: http             # 多个端口时必填；也是别人用 targetPort: http 引用它的依据
      port: 8080             # Service 对外暴露的端口
      targetPort: http       # 转发到容器的哪个端口（端口名，指向 containerPort: 80）
      protocol: TCP
      # nodePort: 30080      # 仅当 type 为 NodePort / LoadBalancer 时有效，不写则随机分配

  # ④ 会话保持：默认 None（每个 TCP 连接独立选后端）
  #    改成 ClientIP 会把同一源 IP 固定到同一 Pod，但在 NAT 出口场景下会破坏负载均衡
  sessionAffinity: None
